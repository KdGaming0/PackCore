plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Essential Maven repositories for dependencies
    maven { url "https://repo.essential.gg/repository/maven-public" }
    mavenCentral()
    maven { url 'https://maven.wispforest.io/releases/' }
    maven { url = 'https://maven.terraformersmc.com/' }
    maven { url = "https://api.modrinth.com/maven" }
    maven { name = "Terraformers"; url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Minecraft + Mappings
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"

    // Core Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Kotlin support
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

    // Essential libraries
    implementation include("gg.essential:elementa:${elementa_version}")
    modImplementation include("gg.essential:universalcraft-${minecraft_version}-fabric:${universalcraft_version}")

    // Mod integrations
    modImplementation "com.terraformersmc:Vistas:${vistas_version}"
    modImplementation "io.wispforest:owo-lib:${project.owo_version}"
    modImplementation include("maven.modrinth:midnightlib:${midnightlib_version}")
    modRuntimeOnly("com.terraformersmc:modmenu:${modmenu_version}")

    modImplementation "io.wispforest.lavender-md:core:${project.lavender_md_version}"
    modImplementation "io.wispforest.lavender-md:owo-ui:${project.lavender_md_version}"

    // Additional libraries
    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'
}

processResources {
    // Replace placeholders in fabric.mod.json with gradle.properties values
    inputs.properties([
            version: version,
            minecraft_version: minecraft_version,
            loader_version: loader_version,
            fabric_kotlin_version: fabric_kotlin_version,
            vistas_version: vistas_version,
            owo_version: owo_version,
            java_version: java_version
    ])

    filesMatching("fabric.mod.json") {
        expand([
                version: version,
                minecraft_version: minecraft_version,
                loader_version: loader_version,
                fabric_kotlin_version: fabric_kotlin_version,
                vistas_version: vistas_version,
                owo_version: owo_version,
                java_version: java_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = java_version.toInteger()
}

java {
    // Generate sources JAR alongside the compiled mod JAR
    withSourcesJar()
}

jar {
    // Include LICENSE in the JAR, renamed to match mod name
    inputs.property "archivesName", project.base.archivesName
    from("LICENSE") { rename { "${it}_${inputs.properties.archivesName}" } }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = archives_base_name
            from components.java
        }
    }
}

kotlin {
    // Ensure Kotlin uses the correct Java version
    jvmToolchain(java_version.toInteger())
}
